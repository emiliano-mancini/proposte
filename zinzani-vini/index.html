<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zinzani Vini – raccolta materiali (bozza)</title>
<style>body{margin:0;font:13px/1.3 monospace;background:#fff;color:#000}#m{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:6px}#m div{border:1px solid #ccc}#m img{width:100%;height:150px;object-fit:contain;background:#eee;display:block}#m p{margin:2px;word-break:break-all;font-size:12px}#p{padding:6px;font-size:13px}#p div{border-bottom:1px solid #ccc;padding:3px 0}</style></head><body>
<h1>Raccolta materiali (bozza di lavoro)</h1><div id="s">caricamento…</div><div id="p"></div><div id="m"></div>
<script>
var B='https://www.zinzanivini.it/wp-json/';var all=[];
function med(d){d.forEach(function(x){if(!x.media_details)return;all.push(x)});draw()}
function draw(){var m=document.getElementById('m');m.innerHTML='';document.getElementById('s').textContent='media: '+all.length;
all.filter(function(x){return (x.media_details.width||0)>=600}).sort(function(a,b){return a.source_url<b.source_url?-1:1}).forEach(function(x){var t=(x.media_details.sizes&&x.media_details.sizes.medium)?x.media_details.sizes.medium.source_url:x.source_url;
var d=document.createElement('div');d.innerHTML='<img src="'+t+'"><p>'+x.source_url.replace(/^.*uploads\//,'')+' '+x.media_details.width+'x'+x.media_details.height+'</p>';m.appendChild(d)})}
function prod(d){var p=document.getElementById('p');d.forEach(function(x){var e=document.createElement('div');var tmp=document.createElement('div');tmp.innerHTML=x.short_description||'';
e.textContent=x.name+' | '+(x.prices?(x.prices.price/100)+' '+x.prices.currency_code:'')+' | '+x.permalink.replace('https://www.zinzanivini.it','')+' | img: '+(x.images&&x.images[0]?x.images[0].src.replace(/^.*uploads\//,''):'')+' | '+tmp.textContent.trim().slice(0,160);p.appendChild(e)})}
function js(u){var s=document.createElement('script');s.src=u;document.head.appendChild(s)}
for(var i=1;i<=3;i++)js(B+'wp/v2/media?per_page=100&page='+i+'&_jsonp=med');
js(B+'wc/store/v1/products?per_page=60&_jsonp=prod');
</script></body></html>
