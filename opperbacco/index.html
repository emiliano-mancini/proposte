<h2>Media WP</h2><div id="m">(nessuna risposta)</div><h2>Pagine</h2><div id="p">(nessuna risposta)</div><h2>Post</h2><div id="q">(nessuna risposta)</div>
<script>
function M(d){document.getElementById('m').innerHTML=d.map(x=>'<div>'+(x.media_details&&x.media_details.width)+'x'+(x.media_details&&x.media_details.height)+' '+x.source_url.replace('https://opperbacco.it/wp-content/uploads/','')+' | '+x.date.slice(0,10)+'</div>').join('')}
function M2(d){document.getElementById('m').innerHTML+=d.map(x=>'<div>'+(x.media_details&&x.media_details.width)+'x'+(x.media_details&&x.media_details.height)+' '+x.source_url.replace('https://opperbacco.it/wp-content/uploads/','')+' | '+x.date.slice(0,10)+'</div>').join('')}
function P(d){document.getElementById('p').innerHTML=d.map(x=>'<div>'+x.link+' | '+x.modified.slice(0,10)+' | '+x.title.rendered+'</div>').join('')}
function Q(d){document.getElementById('q').innerHTML=d.map(x=>'<div>'+x.link+' | '+x.date.slice(0,10)+' | '+x.title.rendered+'</div>').join('')}
</script>
