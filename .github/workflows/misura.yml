name: Misura e-commerce

on:
  workflow_dispatch:
    inputs:
      siti:
        description: "Elenco slug=url separati da spazio (es. idrofast=https://idrofastshop.com/)"
        required: true

permissions:
  contents: write

concurrency:
  group: misura
  cancel-in-progress: false

jobs:
  misura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa Playwright
        run: |
          npm i --no-save playwright@1.48.2
          npx playwright install --with-deps chromium

      - name: Misura
        env:
          SITI: ${{ github.event.inputs.siti }}
        run: node tools/misura.mjs $SITI

      - name: Salva nel repository
        run: |
          git config user.name "proposte-bot"
          git config user.email "proposte-bot@users.noreply.github.com"
          git add misure
          git diff --cached --quiet || git commit -m "Misure: $(ls misure | wc -l) siti [skip ci]"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
